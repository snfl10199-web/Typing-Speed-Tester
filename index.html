<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Speed Tester</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5eefb;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --good: #22c55e;
      --bad: #f87171;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.12), transparent 25%),
        linear-gradient(135deg, #020617 0%, var(--bg) 45%, #111827 100%);
      color: var(--text);
    }

    .card {
      width: min(920px, calc(100vw - 24px));
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.45);
      padding: 28px;
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .grid {
      display: grid;
      gap: 18px;
      grid-template-columns: 1.2fr 0.8fr;
      margin-top: 24px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.98), rgba(17, 24, 39, 0.98));
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 18px;
      padding: 18px;
    }

    .label {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.72rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .word-box {
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(59, 130, 246, 0.14));
      border: 1px solid rgba(56, 189, 248, 0.18);
      border-radius: 16px;
      padding: 16px;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 800;
      text-align: center;
      word-break: break-word;
      line-height: 1.3;
    }

    .hint {
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .stat {
      background: var(--panel-2);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 14px;
      padding: 12px;
    }

    .stat-title {
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
    }

    .input-wrap {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    input {
      flex: 1;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.94);
      color: var(--text);
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    button {
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #08111f;
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.2s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .status {
      margin-top: 10px;
      min-height: 1.3em;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .status.good { color: var(--good); }
    .status.bad { color: var(--bad); }

    .mini-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>타이핑 연습 게임</h1>
    <p>아래 단어를 보고 그대로 타이핑해 보세요. 입력한 글자 수와 맞춘 글자 수를 기준으로 정확도와 타수(자/분)를 계산합니다.</p>

    <section class="grid">
      <article class="panel">
        <div class="label">현재 단어</div>
        <div id="wordBox" class="word-box">준비 중...</div>
        <div class="hint">단어를 정확히 입력하면 다음 단어가 자동으로 바뀝니다.</div>
      </article>

      <article class="panel">
        <div class="label">점수</div>
        <div class="stats">
          <div class="stat"><div class="stat-title">정확도</div><div id="accuracyValue" class="stat-value">100%</div></div>
          <div class="stat"><div class="stat-title">타수</div><div id="wpmValue" class="stat-value">0</div></div>
          <div class="stat"><div class="stat-title">맞힌 단어</div><div id="correctWordsValue" class="stat-value">0</div></div>
          <div class="stat"><div class="stat-title">소요 시간</div><div id="timeValue" class="stat-value">0.0s</div></div>
        </div>

        <div class="input-wrap">
          <input id="inputBox" type="text" autocomplete="off" spellcheck="false" placeholder="여기에 단어를 입력하세요" />
          <button id="resetBtn" type="button">다시 시작</button>
        </div>
        <div id="statusText" class="status">입력창에 포커스가 맞춰져 있습니다.</div>
        <div class="mini-note">팁: 입력 중에는 스페이스나 엔터가 필요 없고, 단어를 정확히 맞추면 자동으로 다음 단어로 넘어갑니다.</div>
      </article>
    </section>
  </main>

  <script>
    const wordList = [
      'apple', 'banana', 'python', 'javascript', 'typing', 'speed', 'practice', 'keyboard',
      'screen', 'program', 'rocket', 'garden', 'forest', 'sunrise', 'learn', 'coding',
      'welcome', 'random', 'player', 'window', 'cloud', 'music', 'story', 'garden', 'bridge'
    ];

    const wordBox = document.getElementById('wordBox');
    const inputBox = document.getElementById('inputBox');
    const accuracyValue = document.getElementById('accuracyValue');
    const wpmValue = document.getElementById('wpmValue');
    const correctWordsValue = document.getElementById('correctWordsValue');
    const timeValue = document.getElementById('timeValue');
    const statusText = document.getElementById('statusText');
    const resetBtn = document.getElementById('resetBtn');

    let currentWord = '';
    let startTime = null;
    let correctWords = 0;
    let totalTyped = 0;
    let correctTyped = 0;

    function randomWord() {
      return wordList[Math.floor(Math.random() * wordList.length)];
    }

    function setWord() {
      currentWord = randomWord();
      wordBox.textContent = currentWord;
      statusText.textContent = '새 단어가 출제되었습니다. 입력을 시작해 보세요.';
      statusText.className = 'status';
    }

    function updateStats() {
      const elapsedSeconds = startTime ? (Date.now() - startTime) / 1000 : 0;
      const elapsedMinutes = elapsedSeconds / 60;
      const accuracy = totalTyped > 0 ? Math.round((correctTyped / totalTyped) * 100) : 100;
      const cpm = elapsedMinutes > 0 ? Math.round(correctTyped / elapsedMinutes) : 0;

      accuracyValue.textContent = `${accuracy}%`;
      wpmValue.textContent = `${cpm}`;
      correctWordsValue.textContent = `${correctWords}`;
      timeValue.textContent = `${elapsedSeconds.toFixed(1)}s`;
    }

    function showStatus(message, type = '') {
      statusText.textContent = message;
      statusText.className = `status ${type}`.trim();
    }

    function resetGame() {
      inputBox.value = '';
      startTime = null;
      correctWords = 0;
      totalTyped = 0;
      correctTyped = 0;
      setWord();
      updateStats();
      inputBox.focus();
    }

    inputBox.addEventListener('input', () => {
      const typed = inputBox.value;

      if (!startTime) {
        startTime = Date.now();
      }

      totalTyped = typed.length;
      correctTyped = typed.split('').filter((char, index) => char === currentWord[index]).length;
      updateStats();

      if (typed === currentWord) {
        correctWords += 1;
        showStatus('정답! 다음 단어로 넘어갑니다.', 'good');
        inputBox.value = '';
        setWord();
        updateStats();
      } else if (typed.length > currentWord.length) {
        showStatus('길이가 너무 깁니다. 다시 입력해 보세요.', 'bad');
      } else if (typed.length > 0) {
        const nextChar = currentWord[typed.length];
        if (nextChar === undefined) {
          showStatus('단어가 일치하지 않습니다. 다시 입력해 보세요.', 'bad');
        } else {
          showStatus(`다음 글자는 '${nextChar}' 입니다.`, '');
        }
      }
    });

    resetBtn.addEventListener('click', resetGame);

    resetGame();
  </script>
</body>
</html>
